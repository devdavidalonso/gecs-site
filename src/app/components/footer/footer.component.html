<footer id="footer" class="footer" role="contentinfo">
  <div class="wf-wrap">
    <div class="wf-container">
      @for (column of columns; track column.title) {
        <section class="widget">
          <h3 class="widget-title">{{ column.title }}</h3>
          <ul class="custom-menu">
            @for (link of column.links; track link.href + link.label) {
              <li class="menu-item">
                <a [routerLink]="link.href">{{ link.label }}</a>
              </li>
            }
          </ul>
        </section>
      }
    </div>
  </div>

  <div id="bottom-bar" role="contentinfo">
    <div class="wf-wrap">
      <div class="wf-container-bottom">
        <div class="wf-float-left">
          Grupo Espírita Cairbar Schutel - Todos os direitos reservados
        </div>
        <div class="wf-float-right">
          <div class="bottom-text-block">
            <p>
              por
              <a href="https://carolchaim.com" target="_blank" rel="noopener"
                >carolchaim.com</a
              >
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</footer>

<button
  class="scroll-top"
  [class.visible]="showGoToTop()"
  (click)="scrollToTop()"
  aria-label="Voltar ao topo"
  type="button"
>
  <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" aria-hidden="true">
    <path
      fill="currentColor"
      d="M11.7,6.3l-3-3c-0.2-0.2-0.4-0.3-0.7-0.3s-0.5,0.1-0.7,0.3l-3,3c-0.4,0.4-0.4,1,0,1.4c0.4,0.4,1,0.4,1.4,0L7,6.4V12c0,0.6,0.4,1,1,1s1-0.4,1-1V6.4l1.3,1.3c0.4,0.4,1,0.4,1.4,0C11.9,7.5,12,7.3,12,7S11.9,6.5,11.7,6.3z"
    />
  </svg>
  <span class="screen-reader-text">Voltar ao topo</span>
</button>
